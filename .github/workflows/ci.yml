name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The go directive in go.mod is 1.25.0, the go-sdk's own floor. Reading
      # the version from the file rather than pinning it here keeps the two
      # from drifting apart.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      # The demo is the README's entry command. If it stops running the README
      # is lying, so CI runs it rather than trusting it.
      - name: demo runs end to end
        run: go run ./cmd/demo > /dev/null
